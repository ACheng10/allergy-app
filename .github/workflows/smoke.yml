name: Simulator smoke test

# Builds the app, opens each main screen in an iPhone Simulator with a sample
# profile (see Models/DebugFlags.swift), and prints small JPEG screenshots as
# base64 into the job log.
# Manual only: macOS minutes count 10x against a private repo's free allowance.
on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project AllergyApp/AllergyApp.xcodeproj \
            -target AllergyApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -quiet
          ls -la AllergyApp/build/Debug-iphonesimulator/AllergyApp.app
      - name: Launch and screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          print(next(x['udid'] for r,ds in d.items() if 'iOS' in r for x in ds if x['name'].startswith('iPhone')))")
          echo "Device $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 30   # let SpringBoard settle after first boot
          xcrun simctl install "$UDID" AllergyApp/build/Debug-iphonesimulator/AllergyApp.app
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.acheng10.allergycard 2>/dev/null || true
            xcrun simctl launch "$UDID" com.acheng10.allergycard "$@" >/dev/null
            sleep 8
            xcrun simctl io "$UDID" screenshot "$name.png"
            sips -Z 400 -s format jpeg -s formatOptions 70 "$name.png" --out "$name.jpg" >/dev/null
            echo "----- screenshot $name -----"
            base64 -i "$name.jpg"
          }
          shoot setup
          shoot mycard -demo
          shoot destinations -demo -showDestinations
          shoot waiter -demo -showWaiter
          shoot ask -demo -tab 1
          shoot emergency -demo -tab 2
          shoot profile -demo -tab 3
          echo "----- crash reports -----"
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i allergy || echo "none"
          echo "----- end -----"
