name = "allergy-card-reports"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GITHUB_REPO = "ACheng10/allergy-app"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   GITHUB_TOKEN  fine-grained token: this repo only, Issues read and write
#   APP_KEY       any random string; the same value goes in ReportConfig.appKey
